[project]
name = "coinbase-agentkit-model-context-protocol"
version = "0.1.0"
description = "Coinbase AgentKit Model Context Protocol (MCP) extension"
requires-python = "~=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "coinbase",
    "sdk",
    "crypto",
    "cdp",
    "mcp",
    "model-context-protocol",
    "ai",
    "agent",
]
dependencies = [
    "coinbase-agentkit>=0.7.2,<0.8",
    "mcp>=1.10.0,<2",
    "pydantic>=2.0,<3",
    "anyio>=4.0.0,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.7.1,<0.8",
    "mypy>=1.13.0,<2",
    "pytest>=8.3.3,<10",
    "pytest-asyncio>=0.25.3,<2",
    "pytest-cov>=6.0.0,<7",
    "towncrier>=24.8.0,<25",
]

[tool.hatch.build.targets.sdist]
include = [
    "coinbase_agentkit_model_context_protocol",
    "README.md",
    "CHANGELOG.md",
    "changelog.d",
    "tests",
]

[tool.hatch.build.targets.wheel]
include = ["coinbase_agentkit_model_context_protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["./build/**", "./dist/**", "./docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["D213", "D203", "D100", "D104", "D107", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["coinbase_agentkit", "coinbase_agentkit_model_context_protocol"]

[tool.towncrier]
package = "coinbase_agentkit_model_context_protocol"
filename = "CHANGELOG.md"
directory = "changelog.d/"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/coinbase/agentkit/pull/{issue})"

[tool.towncrier.fragment.feature]
name = "Added"

[tool.towncrier.fragment.bugfix]
name = "Fixed"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::pydantic.PydanticDeprecatedSince212",
    "ignore::DeprecationWarning:websockets.*",
]
