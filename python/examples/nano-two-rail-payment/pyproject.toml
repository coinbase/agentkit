[project]
name = "nano-two-rail-payment"
version = "0.0.1"
description = "AgentKit Two-Rail Payment Example: settle on Nano (XNO) and EVM/USDC behind one interface"
requires-python = "~=3.10"
readme = "README.md"
dependencies = [
    "coinbase-agentkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
coinbase-agentkit = { path = "../../../python/coinbase-agentkit", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["D213", "D203", "D100", "D104", "D107", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["coinbase_agentkit, cdp"]
